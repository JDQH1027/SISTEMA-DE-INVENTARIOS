<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-indigo-600 mb-2">Inventario</h1>
                <p class="text-gray-600">Sistema de Gestión Empresarial</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Usuario</label>
                    <input 
                        type="text" 
                        id="username" 
                        placeholder="Ingrese su usuario" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        required
                    >
                </div>

                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Ingrese su contraseña" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        required
                    >
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300"
                >
                    Iniciar Sesión
                </button>
            </form>

            <div id="alertError" class="mt-4 p-3 bg-red-100 text-red-700 rounded-lg hidden"></div>

            <div class="mt-8 p-4 bg-gray-100 rounded-lg text-sm">
                <p class="font-semibold text-gray-700 mb-2">Credenciales de Prueba:</p>
                <p class="text-gray-600"><strong>Administrador:</strong> admin / admin123</p>
                <p class="text-gray-600"><strong>Empleado:</strong> employee / emp123</p>
            </div>

            <div class="mt-4 text-center text-sm text-gray-600">
                <p>💡 Prueba con: <strong>admin</strong> / <strong>admin123</strong> o <strong>employee</strong> / <strong>emp123</strong></p>
            </div>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
